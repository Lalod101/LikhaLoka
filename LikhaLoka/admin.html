<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LikhaLoka - Admin</title>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>

    <a href="artisans.html">Artisans</a>

  <section>
    <h2>Admin</h2>

    <h3>Products</h3>
    <input type="text" id="productName" placeholder="Product name">
    <select id="productCategory">
      <option value="Hablon">Hablon</option>
      <option value="Piña">Piña</option>
      <option value="Woven">Woven</option>
    </select>
    <input type="number" id="productPrice" placeholder="Price">
    <button onclick="addProduct()">Add</button>
    <table id="productTable"></table>

    <h3>Artisans</h3>
    <input type="text" id="artisanName" placeholder="Artisan name">
    <input type="text" id="artisanCraft" placeholder="Craft">
    <input type="text" id="artisanPlace" placeholder="Place">
    <button onclick="addArtisan()">Add</button>
    <table id="artisanTable"></table>

    <br>
    <button onclick="resetData()">Reset to sample data</button>
  </section>

  <footer>© 2026 LikhaLoka</footer>

  <script src="data.js"></script>
  <script src="admin.js"></script>
